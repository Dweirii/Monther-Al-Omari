<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="OHG">
  <!--
    The wordmark reduced to what survives at 16 pixels: its heavy O and the
    red full stop. Set as geometry rather than as text on purpose — a browser
    renders an SVG favicon with whatever font it has, so a <text> element
    would draw the mark in a different typeface on every platform.
  -->
  <rect width="512" height="512" fill="#0A0A0A"/>
  <circle cx="215" cy="240" r="125" fill="none" stroke="#FFFFFF" stroke-width="80"/>
  <circle cx="410" cy="392" r="48" fill="#E4022C"/>
</svg>
